name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # CI signs test licenses with a throwaway key pair; the real private key never leaves the maintainer's machine.
      - run: node scripts/license/keygen.cjs
      - run: npm run build
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run test:license
      - run: npm run e2e
